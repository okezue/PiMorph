[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "endopigraph-ajmorph"
version = "1.1.0.dev0"
description = "PiMorph: endothelial cell-complex inference (pimorph) plus the legacy EndoPiGraph-AJmorph pi-graph pipeline (endopigraph)."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
  {name = "EndoPiGraph Team"}
]
dependencies = [
  "numpy>=1.23",
  "pandas>=1.5",
  "scikit-image>=0.21",
  "scipy>=1.10",
  "tifffile>=2023.7.10",
  "networkx>=3.1",
  "matplotlib>=3.7",
  "PyYAML>=6.0",
  "tqdm>=4.66",
  "requests>=2.31"
]

[project.optional-dependencies]
cellpose = [
  "cellpose>=4.0.0"
]
ml = [
  "scikit-learn>=1.3"
]
complex = [
  "shapely>=2.0",
  "pyarrow>=15.0",
  "zarr>=2.18",
  "ome-zarr>=0.9",
  "hypothesis>=6.100",
  "numba>=0.59"
]
torch = [
  "torch>=2.3",
  "torchvision>=0.18",
  "cellpose>=4.0.0"
]
aws = [
  "boto3>=1.34"
]
dev = [
  "pytest>=7.4",
  "ruff>=0.5.0",
  "scikit-learn>=1.3",
  "hypothesis>=6.100"
]

[project.scripts]
endopigraph = "endopigraph.cli:main"
pimorph = "pimorph.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/endopigraph", "src/pimorph"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "torch: tests that require torch (skipped when torch is not installed)",
  "slow: long-running tests (deselect with -m 'not slow')",
  "data: tests that need local datasets under data/ (skipped when absent)"
]

[tool.ruff]
target-version = "py310"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W"]

[tool.ruff.lint.per-file-ignores]
"src/endopigraph/download.py" = ["E501"]
"src/endopigraph/interfaces.py" = ["E501"]
"src/endopigraph/pipeline.py" = ["E501"]
"src/endopigraph/report.py" = ["E501"]
